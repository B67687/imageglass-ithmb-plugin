# ci.yml — Build + clippy + security advisory + package .igplugin.zip artifacts.
name: ci
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request: { branches: [main] }
permissions: { contents: read }

# RUSTFLAGS left EMPTY deliberately: setup-rust-toolchain injects `-D warnings`
# when the var is unset, promoting Cargo.toml warn-level lints to errors in CI
# while local builds stay green. Empty + set = no injection; Cargo.toml governs.
env:
  RUSTFLAGS: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            pkg_tag: linux
          - os: macos-latest
            pkg_tag: macos
          - os: windows-latest
            pkg_tag: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true
          cache-key: "plugin-rust-${{ matrix.os }}"
      - name: Build
        run: cargo build --release
      - name: Verify symbol export
        shell: bash
        if: runner.os != 'Windows'
        run: |
          LIB=""
          for cand in target/release/libithmb_core_cabi.so target/release/libithmb_core_cabi.dylib; do
            if [ -e "$cand" ]; then LIB="$cand"; break; fi
          done
          if [ -n "$LIB" ]; then
            # ELF (Linux) exports live in .dynsym (nm -D); Mach-O (macOS)
            # exports live in the dyld export trie (nm -gU). Accept either.
            if nm -D "$LIB" 2>/dev/null | grep -q ig_plugin_get_api \
               || nm -gU "$LIB" 2>/dev/null | grep -q ig_plugin_get_api; then
              echo "Symbol verified"
            else
              echo "Missing symbol!"
              exit 1
            fi
          else
            echo "No cdylib artifact found"
            exit 1
          fi
      - name: Verify symbol export (Windows PE export table)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-ChildItem 'target/release' -Filter '*.dll' | Select-Object -First 1
          if (-not $dll) { Write-Error 'No DLL found in target/release'; exit 1 }
          $bytes = [System.IO.File]::ReadAllBytes($dll.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) { Write-Error 'Invalid PE signature' }
          $optOffset = $peOffset + 24
          $magic = [BitConverter]::ToUInt16($bytes, $optOffset)
          $pe32plus = ($magic -eq 0x20B)
          $numSections = [BitConverter]::ToUInt16($bytes, $peOffset + 6)
          $optSize = [BitConverter]::ToUInt16($bytes, $peOffset + 20)
          # Data directory 0 = export table (PE32+ at optOffset+112, PE32 at optOffset+96)
          $ddExportOffset = $optOffset + $(if ($pe32plus) { 112 } else { 96 })
          $exportRva = [BitConverter]::ToInt32($bytes, $ddExportOffset)
          if ($exportRva -eq 0) { Write-Error 'No export directory (no exports?)' }
          $sectionsOffset = $optOffset + $optSize
          function RvaToOffset([int]$rva) {
            for ($i = 0; $i -lt $numSections; $i++) {
              $s = $sectionsOffset + ($i * 40)
              $va = [BitConverter]::ToInt32($bytes, $s + 12)
              $vsize = [BitConverter]::ToInt32($bytes, $s + 8)
              $rawPtr = [BitConverter]::ToInt32($bytes, $s + 20)
              if ($rva -ge $va -and $rva -lt ($va + $vsize)) { return $rawPtr + ($rva - $va) }
            }
            return -1
          }
          $exportFileOffset = RvaToOffset $exportRva
          if ($exportFileOffset -lt 0) { Write-Error 'Export directory not found in any section' }
          $numNames = [BitConverter]::ToInt32($bytes, $exportFileOffset + 24)
          $namesOffset = RvaToOffset ([BitConverter]::ToInt32($bytes, $exportFileOffset + 32))
          if ($namesOffset -lt 0) { Write-Error 'Export names table not found' }
          $found = $false
          for ($i = 0; $i -lt $numNames; $i++) {
            $nameRva = [BitConverter]::ToInt32($bytes, $namesOffset + ($i * 4))
            $nameOffset = RvaToOffset $nameRva
            if ($nameOffset -lt 0) { continue }
            $sb = New-Object System.Text.StringBuilder
            $j = $nameOffset
            while ($bytes[$j] -ne 0) { [void]$sb.Append([char]$bytes[$j]); $j++ }
            if ($sb.ToString() -eq 'ig_plugin_get_api') { $found = $true; break }
          }
          if (-not $found) { Write-Error 'Export ig_plugin_get_api NOT FOUND in PE export table'; exit 1 }
          Write-Host "Symbol verified: ig_plugin_get_api (PE export table, $($dll.Name))"
      - name: ABI smoke test (ctypes, no GUI)
        if: runner.os == 'Linux'
        run: python3 scripts/abi-smoke.py tests/fixtures/test1.ithmb
      - name: Package .igplugin.zip
        id: package
        shell: bash
        run: |
          bash scripts/package.sh "${{ matrix.pkg_tag }}"
          echo "artifact-name=ithmb-codec-${{ matrix.pkg_tag }}.igplugin.zip" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ithmb-codec-${{ matrix.pkg_tag }}.igplugin.zip
          path: dist/*.igplugin.zip
  verify_clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
          cache: true
          cache-key: "plugin-clippy"
      - name: cargo clippy
        run: cargo clippy --all-features --all-targets
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: nextest@0.9.143
      - name: cargo nextest
        run: cargo nextest run --all-features --all-targets

  verify_deny:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo deny check
        shell: bash
        run: |
          # Pinned prebuilt musl binary instead of the Docker action — the action
          # reinstalls the toolchain + advisory DB into a fresh container on every
          # run. Direct download is byte-identical and ~30-60s faster.
          curl -sSfL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz -o /tmp/cargo-deny.tar.gz
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp --strip-components=1
          /tmp/cargo-deny --log-level warn --manifest-path ./Cargo.toml --all-features check

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks (secrets in history)
        run: |
          # The gitleaks-action computes a commit range (<first>^..<last>) that
          # breaks on root-commit histories (no parent). Scan all commits
          # directly instead.
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --log-opts="--no-merges --all"

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ithmb-codec-*
          merge-multiple: true
      - name: Create GitHub Release (draft; notes = this version's section only)
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          awk -v v="## [$VER]" 'BEGIN{p=0} /^## \[/{if(p)exit; if(index($0,v)==1)p=1; next} p' CHANGELOG.md > NOTES.md
          gh release create "$TAG" --draft --notes-file NOTES.md *.igplugin.zip
        env:
          GH_TOKEN: ${{ github.token }}

  verify_machete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.9.2 --locked
      - name: cargo machete
        run: cargo machete
