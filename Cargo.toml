[package]
name = "ithmb-core-cabi"
version = "1.1.4"
edition = "2024"
license = "MIT"
description = "C ABI plugin for ImageGlass v10 to decode .ithmb thumbnail files using ithmb-core"
repository = "https://github.com/B67687/ImageGlass-Ithmb-Plugin"
homepage = "https://github.com/B67687/ImageGlass-Ithmb-Plugin"
documentation = "https://docs.rs/ithmb-core-cabi"
keywords = ["ithmb", "thumbnail", "apple", "imageglass", "image"]
categories = ["multimedia::images", "multimedia::video"]
rust-version = "1.88.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
ithmb-core = "1.9"
libc = "0.2"

[lints.rust]
unsafe_code = "allow"
unused_crate_dependencies = "deny"

[lints.clippy]
# Groups — inventory: deny core via `all`, warn pedantic/nursery/cargo (cherry-pick, never wholesale)
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Hard denies - turn warnings into errors for sharp tools
undocumented_unsafe_blocks = { level = "warn", priority = 0 }
multiple_unsafe_ops_per_block = { level = "warn", priority = 0 }
unwrap_used = { level = "warn", priority = 0 }
expect_used = { level = "warn", priority = 0 }
panic = { level = "warn", priority = 0 }
todo = "deny"
unimplemented = "deny"
unreachable = "warn"
indexing_slicing = { level = "warn", priority = 0 }
mem_forget = "deny"
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
as_underscore = "deny"
as_ptr_cast_mut = "deny"
ptr_as_ptr = "warn"
borrow_as_ptr = "warn"
fn_to_numeric_cast_any = "deny"
clone_on_ref_ptr = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
exit = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
use_debug = "warn"

# Stylistic relaxations (project-wide opinions)
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
mod_module_files = { level = "allow", reason = "legacy mod.rs layout, rename would churn module tree" }
empty_drop = "warn"

# CI/dev profile — keep line tables so backtraces still resolve file:line, but
# strip full DWARF from dependencies (never debugged inside ithmb-core/zune-jpeg).
# See docs/adr/0001-ci-optimization.md.
[profile.dev.package."*"]
debug = "line-tables-only"
